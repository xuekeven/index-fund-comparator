[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "index-fund-comparator-api"
version = "0.1.0"
description = "EOD index fund comparison API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "openpyxl>=3.1,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pypdf>=6.0,<7.0",
  "pydantic-settings>=2.7,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[project.scripts]
ifc-sync-sse = "app.sync.sse_funds:main"
ifc-sync-sse-details = "app.sync.sse_details:main"
ifc-sync-szse = "app.sync.szse_funds:main"
ifc-sync-szse-details = "app.sync.szse_details:main"
ifc-sync-szse-quotes = "app.sync.szse_quotes:main"
ifc-sync-csrc = "app.sync.csrc_funds:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]
