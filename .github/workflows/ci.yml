name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: index_fund_comparator_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/index_fund_comparator_test
      IFC_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/index_fund_comparator_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - working-directory: backend
        run: uv sync --extra dev --locked
      - working-directory: backend
        run: uv run alembic upgrade head
      - working-directory: backend
        run: uv run alembic check
      - working-directory: backend
        run: uv run ruff check app tests
      - working-directory: backend
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-fail-under=55
      - run: bash deploy/test-manage-crontab.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - working-directory: frontend
        run: pnpm install --frozen-lockfile
      - working-directory: frontend
        run: pnpm test
      - working-directory: frontend
        run: pnpm lint
      - working-directory: frontend
        run: pnpm build
